name: Code checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install check dependencies
        run: python -m pip install numpy==2.4.6 scipy==1.17.1 pytest==9.1.1 ruff==0.16.3 cffconvert==2.0.0
      - name: Compile
        run: python -m compileall -q scripts tests
      - name: Lint
        run: python -m ruff check .
      - name: Test
        run: python -m pytest -q
      - name: Validate citation metadata
        run: cffconvert --validate --infile CITATION.cff
